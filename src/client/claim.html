<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Office · گذرواژهٔ شما</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="./login.css" />
  </head>
  <body>
    <main class="card">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="72" height="72"><rect x="6" y="30" width="52" height="8" rx="3" fill="#e0a96d"/><rect x="18" y="14" width="28" height="18" rx="3" fill="#2b2d42"/><rect x="21" y="17" width="22" height="12" rx="1" fill="#7cf29a"/><circle cx="32" cy="50" r="9" fill="#ff8a5b"/><circle cx="29" cy="48" r="1.8" fill="#222"/><circle cx="35" cy="48" r="1.8" fill="#222"/></svg>
      </div>
      <h1 id="title">دفتر شما آماده است 🎉</h1>
      <p class="sub" id="sub">در حال آماده‌سازی…</p>
      <section id="reveal" hidden>
        <p class="warn"><strong>این گذرواژه را همین حالا یادداشت کنید.</strong> فقط همین یک‌بار نمایش داده می‌شود؛ دفتر فقط نسخهٔ رمزنگاری‌شدهٔ آن را نگه می‌دارد و بعداً نمی‌تواند دوباره نشانش دهد. آن را با هم‌تیمی‌هایی که دعوت می‌کنید به‌اشتراک بگذارید.</p>
        <div class="secret"><code id="pw"></code><button type="button" id="copy" class="mini">کپی</button></div>
        <label class="check"><input type="checkbox" id="saved" /> گذرواژه را در جای امنی ذخیره کردم</label>
        <button type="button" id="enter" disabled>ورود به دفتر</button>
      </section>
      <p id="error" class="error" role="alert"></p>
      <a id="login" href="/login" hidden>رفتن به صفحهٔ ورود ←</a>
    </main>
    <script type="module" src="./claim.ts"></script>
  </body>
</html>
