<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Office · پیوستن</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="./login.css" />
  </head>
  <body>
    <main class="card">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="72" height="72"><rect x="6" y="30" width="52" height="8" rx="3" fill="#e0a96d"/><rect x="18" y="14" width="28" height="18" rx="3" fill="#2b2d42"/><rect x="21" y="17" width="22" height="12" rx="1" fill="#7cf29a"/><circle cx="32" cy="50" r="9" fill="#ff8a5b"/><circle cx="29" cy="48" r="1.8" fill="#222"/><circle cx="35" cy="48" r="1.8" fill="#222"/></svg>
      </div>
      <h1 id="title">به دفتر دعوت شده‌اید 🎉</h1>
      <p class="sub" id="sub">در حال بررسی دعوت‌نامه…</p>
      <form id="form" hidden>
        <label>نام شما<input id="name" type="text" maxlength="24" autocomplete="username" spellcheck="false" required /></label>
        <label>گذرواژه را انتخاب کنید<input id="password" type="password" minlength="8" autocomplete="new-password" required /></label>
        <label>گذرواژه را دوباره وارد کنید<input id="again" type="password" minlength="8" autocomplete="new-password" required /></label>
        <p class="note">گذرواژه باید دست‌کم ۸ نویسه داشته باشد. فقط شما به آن دسترسی دارید.</p>
        <button type="submit" id="submit">ساخت حساب کاربری</button>
      </form>
      <p id="error" class="error" role="alert"></p>
      <a id="login" href="/login" hidden>رفتن به صفحهٔ ورود ←</a>
    </main>
    <script type="module" src="./join.ts"></script>
  </body>
</html>
